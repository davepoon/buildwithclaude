interface:
  display_name: "Sequenzy Email Marketing"
  short_description: "Agent guide for using Sequenzy safely"
  default_prompt: 'Raise app push opt-in with a push primer: an in-app step whose button action is request_push_permission (template push-primer) shows the OS notification prompt, or the app''s notification settings when the contact turned them off; target contacts whose pushPermission attribute is not granted or provisional, and read results with in-app stats (pushPermissionGranted/Denied) and the opt-in rate in push settings. Manage geofences (places a mobile app watches) with geofences list/create/update/delete/import or the matching MCP tools; signed-in app users visiting them record app.geofence_entered, app.geofence_exited and app.geofence_dwelled, usable as event triggers with a geofenceId or geofenceGroup property filter and as geofence segment filters such as entered:group=stores:30d. Keep sequences in code with sequences pull and sequences push (MCP: get_sequence_definition and push_sequence_definition): one YAML or JSON definition per sequence with your own keys for the sequence and every step, settings, a trigger and steps in run order (wait such as 2d, email with html, blocks or a template ID to copy, branch with if paths and else, split with percentages, continueIf, tag, untag, end), where nested paths rejoin at the next step and the end is implicit; sequences new <key> writes a starter file and pull --raw returns the explicit steps-plus-connections format; run push --dry-run first to see added, changed and removed steps and where waiting contacts go, a pulled file pushes back unchanged as a no-op, a push never turns a sequence on or off (new ones are drafts), changing an active sequence needs --confirm-live-change, and sequences pushed from code are managedBy code, read-only in the dashboard except on/off, pause and test sends. PostHog events without an email reach the contact whose externalId matches the distinct_id when matchByDistinctId is on (default for new connections; connect posthog --match-by-distinct-id for older ones); it never creates contacts. Connect Mixpanel or Amplitude with integrations connect or connect_integration and just a webhook secret (the CLI generates one): Mixpanel cohorts and Amplitude cohorts become mixpanel-<cohort> / amplitude-<cohort> tags that start tag-added automations for people who join (the first sync tags current members quietly), Amplitude events arrive as product.<event type>, and integrations get or get_integration lists synced cohorts with their tags. Style footers with emailTheme.typography footerFontFamily, footerFontSize (10-16px) and footerLineHeight (1-2) on update_company or companies update --email-theme-json (footer blocks and the auto-added footer; null resets each), and change the auto-added footer''s colors and copy with update_company footerTheme or --footer-theme-json (a merge patch, null resets a field). Edit the double opt-in confirmation email (consent.doubleOptInEmailId) with update_template or templates update; content without {{DOUBLE_OPT_IN_URL}} is rejected. Make a manual-trigger sequence recurring (end-of-month updates, balance reminders, daily sends not tied to an event) with sequences schedule or set_sequence_recurring_enrollment: daily, weekly on chosen weekdays, or monthly on chosen days and/or the last day, at a time in an IANA timezone, re-enrolling the audience at every run (finished contacts enter again, contacts still inside are skipped, one_time sequences never re-enroll). Translate every sequence email and enabled transactional email into a language at once with templates localizations translate-missing or translate_missing_template_localizations (only missing or failed translations; edited, up-to-date and outdated ones are kept; adding a language in the dashboard already does this), and follow progress with templates localizations coverage or get_template_localization_coverage. Move an older verified sending domain onto the current DNS records in place with websites upgrade-dns or upgrade_sending_domain_dns when website.dnsUpgrade.status is available: the user adds the returned CNAMEs next to the current records and removes nothing, the domain keeps sending on its current records and switches by itself about an hour after the required ones are visible on public DNS (sending is normally not interrupted; if that is not possible for a domain, SES sends can be held a few minutes), and dnsUpgrade.oldRecords can be deleted after deleteOldRecordsAfter (8 days after the switch); an older SES-only domain needs a working DMARC record before it can start; it is a recommended, optional one-time upgrade (better deliverability and security) and cannot be cancelled once started. Change every email of a sequence at once with sequences edit-emails or edit_sequence_emails (a cream background everywhere, no header, a new structure for email 2): the prompt picks the emails unless you pass --emails, looks stay identical across them, and --dry-run shows the changes before saving. To try a few designs of one email first, use sequences variations generate/list/use or the *_sequence_email_variation(s) MCP tools; use --all (scope all) gives every email its style, and nothing changes until use. Compare alternative versions of a campaign email with campaigns variations generate/list/edit/use or the *_campaign_variation(s) MCP tools: generation runs in the background (poll until ready), style bold makes completely new designs, edit changes one variation in place, and nothing changes what the campaign sends until use, which keeps the previous content as a variation. Set up two-way Attio sync with integrations set-attio-lists or update_attio_settings: --map/listMap and --tag-map/tagMap put people on Attio lists when they join a Sequenzy list or get a tag, --from-attio/inboundListMap and --from-attio-tag/inboundTagMap add people to Sequenzy lists or tags when they join an Attio list (the Attio token needs webhook:read-write), and --enable-removals/syncRemovals mirrors removals. To suggest what a workspace should connect, run integrations suggestions or list_integration_suggestions: it lists tools found on the company homepage or sign-in page that are not connected yet, and when the site lists pricing it offers every payment provider instead of guessing one (scanComplete false means the site is still being read). Connect SparkLoop (choose Custom as the ESP in SparkLoop) with integrations connect sparkloop or connect_integration using the SparkLoop API key (no webhook token needed), plus the publication ID when the account has several: partner referrals become subscribers with sparkloop.referral_* events, and confirmations and unsubscribes are reported back. Use the accounts CLI for customers'' B2B organizations (not the Sequenzy account from sequenzy account/get_account): list, get, upsert, member management, account events, and delete; account events support owners, admins, all, or none recipients and stable event IDs for retries. Find bulk-created accounts whose alerts reach nobody (no owner or admin) with accounts list --without-event-recipients or list_accounts withoutEventRecipients, and use {{event.organization.*}} merge tags in account alert sequences (the dashboard calls accounts Organizations; organization.* fields work in segments, sequence conditions and {{organization.*}} merge tags, account.* still works); matching-field enrollment on organization.externalId enrolls only the first member per organization. Suggest accounts from shared work email domains with accounts suggestions or list_account_suggestions, and accept only user-confirmed domains with accounts accept-suggestions or accept_account_suggestions. When the app already sends an organization ID, find it with accounts detect-org-ids or detect_account_organization_ids, show the preview from accounts preview-org-id or preview_accounts_from_organization_id, create only after the user confirms with accounts create-from-org-id or create_accounts_from_organization_id, and check the background run with accounts org-id-job or get_account_organization_id_job. The first upsert turns Accounts on and returns 409 when contacts already use an account or account.* attribute; subscriber event account references are ignored with accountIgnored until Accounts is on. Before setting custom attributes, run subscribers attributes or list_subscriber_attributes to reuse existing names and value types; send typed values with --attrs-json or JSON customAttributes, keeping zip codes and IDs with leading zeros as strings. Label recovered capture submissions as reconstructed; payload.recovery marks inferred source attribution and event-time dates. Use submissions <type> <id> or list_capture_submissions to inspect saved accepted answers and payloads, with field/value filters and CSV export; history is forward-only and requires subscribers:read plus widgets:read (form/popup) or landing_pages:read (landing_page). Keep uploads and import monitoring secondary to previews; use open_image_upload and monitor_subscriber_import with explicit companyId when needed. For MCP Apps hosts, use render_email for desktop/mobile email previews and preview_sequence with explicit companyId/sequenceId for connected sequence flows and selectable A/B variant previews. The campaign and sequence email variation list/generate tools open the variations rendered side by side; their use buttons save only after the user confirms. Treat previews as read-only and preserve personalization warnings and access restrictions. Inspect running campaign A/B progress with get_ab_test; use update_ab_test for total duration from original start or audience percentage, retry the same target and discard only failed sample changes. Finish early with select_ab_test_winner only when delivery is authorized; retry the same winner after interruption. On sequence A/B tests, select_ab_test_winner also changes an existing or automatically picked winner for future contacts when the user asks; pass confirmLiveChange while the sequence is active. To keep testing a sequence test that already has a winner, use resume_ab_test (also confirmLiveChange while active); it waits for a manual select_ab_test_winner. For capped A/B campaigns, allow one recipient per variant plus one for the winner; raise or explicitly clear a rejected limit before scheduling again. Treat companyGoals in campaign goal lists as automatically applied Settings goals with open/click attribution; do not copy or mutate them through campaign goal tools. Organize transactional templates with create/update --label, list --label and update --clear-labels; MCP uses labels arrays, [] to clear and omission to preserve on update. Read back assignments after uncertain updates. Track repeated code-rendered emails such as weekly summaries by adding send --track-as <email-type> or send_email trackAs to direct HTML sends; use stable type names, never per-recipient values, and expect code-managed emails (managedBy code) to reject template sends and accept only name, enabled and label updates. Use send --header "Name: value" or send_email headers for extra email headers, such as the caller''s own List-Unsubscribe pair on a transactional send; marketing sends keep Sequenzy''s signed pair, managed headers like From or Subject are never applied, and unapplied headers are reported in ignoredHeaders instead of failing the send, while a malformed or repeated --header or a non-string MCP value is rejected before sending. For cart layouts, use preview_cart_items or blocks preview-cart for presets, mapping suggestions and isolated scenarios; explicitly choose numeric price units before saving through existing block update workflows. Receiving mail is set up on receiving domains, not sending domains; inbound* fields in website.dnsRecords describe an older reply setup. Inspect test delivery attempts with email-sends list/get or list_email_sends/get_email_send. An email that didn''t arrive has an outcome (bounced, blocked, delayed or failed) and a one-sentence reason; relay the reason as is, treat only blocked as the sender''s to fix, and never suppress on failed. To see the deliveries behind a filtered analytics view, filter email-sends list or list_email_sends by --mailbox-provider/mailboxProvider (same values as the analytics filter) and --list/listId; history includes successful and pending tests marked isTestEmail. When requested, rename matching footer company names with update_company using name, renameMatchingFooters and previousCompanyName; refresh and reconfirm on 409. Rename a saved email component with components update --name or update_email_component sending only name, and copy one with components duplicate or duplicate_email_component; copies are named "(Copy)", "(Copy 2)" and so on unless you pass a name, and never become the default footer. Upload email images, including GIFs, up to 10MB with upload_image_asset. For live sequence tests, use get_event_sample to copy the latest received payload without changing the test recipient, or pass optional JSON event properties within the selected MCP surface’s data restrictions and inspect run status before retrying real actions. Treat single-contact signup timestamps at most one hour old as eligible for account notifications, respecting preferences, double opt-in and daily caps; keep older imports silent on creation, allowing notifications on later double opt-in confirmation. Carry source statuses into subscriber imports: map provider values to active, unsubscribed or bounced (not-confirmed or pending contacts import as active), and report the status counts; unsubscribed and bounced rows never enroll or get confirmation emails, and active rows never resubscribe anyone. Use $sequenzy-email-marketing to preview and apply a scoped default footer update, complete an email workflow, read and edit the company design.md (design-md get/update or get_design_md/update_design_md, dry run first and save with the version you read) or manage a saved AI email style, preserving workspace permissions and reviewed revisions, using subscribers:write for explicit lists on subscriber upserts and lists:write for imports into explicit lists or dedicated list membership operations, and using background subscriber tagging operations with stable request keys and explicit uncertain-outcome reconciliation. Preserve non-opener resend exclusions across manual edits and repeated resends; recreate older drafts missing excludedCampaignOpenerIds from the original campaign and review before scheduling. When unsubscribe tracking is disabled, expect direct sequenzy.com unsubscribe links even with a custom tracking domain; actual unsubscribes and their email attribution are still recorded. To keep no copy of sent email content or personalized subjects, and no IP address, user agent or country on opens and clicks, use tracking update --store-content off or update_tracking_settings emailContentStorageEnabled false; view-in-browser links then stop working. Tracked links use one company tracking domain shared by every sending domain; its CNAME (dnsRecords.trackingRecord) is optional and never blocks verification or sending, and links use the shared Sequenzy domain until it verifies. Read it with tracking domain or get_tracking_domain. Set or change it with tracking domain set or set_tracking_domain after confirming the hostname, check it with tracking domain verify or verify_tracking_domain, and remove it with tracking domain remove or remove_tracking_domain only after the user confirms that links in already-sent emails will stop working; websites configure and configure_sending_domain are deprecated. New sending domains publish the bounce subdomain as one CNAME (website.bounceRecords); domains added earlier keep SPF TXT and MX records, never both at the same name. Use real campaign test-send receipts and websites add/check/verify workflows, and submit feedback only when explicitly requested. Use send --json --company for automation, parse stderr JSON Lines and structured MCP failures, retain recovery keys, reuse send idempotency keys after uncertain outcomes, and use stdin only for supported text inputs. Use campaigns from-audience or create_campaign_for_audience to save a selected contact or activity group directly in a campaign draft without creating a list, changing membership or enrolling contacts; inspect the draft before retrying an uncertain response. Use campaign hasAudience as configuration status, not an eligible-recipient count. Review sequence steps with one sample contact and stored A/B labels, then use existing activation and explicit enrollment workflows when requested. To hold one contact on their current step (for example while their account is blocked) and continue later from the same step, use sequences pause-subscribers and resume-subscribers (MCP pause_sequence_subscribers, resume_sequence_subscribers) instead of cancelling and re-enrolling; pause-enrollments only stops new entrants. For Lemon Squeezy, use disconnect_integration to stop ingestion and remove the managed webhook; report cleanupWarning and retry cleanup when requested. To connect RevenueCat, use integrations connect revenuecat or connect_integration with a secret API v2 key and a webhook secret of at least 16 characters that the user also sets as the RevenueCat webhook''s authorization header (or its HMAC signing secret); it is webhook-only with no sync, matches contacts by externalId equal to the RevenueCat app user ID, then by the $email attribute, then by an app user ID that is an email address, and lists unmatched app users as skipped integration activity. To connect Superwall, use integrations connect superwall or connect_integration with only the webhook''s whsec_ signing secret (no API key); it is webhook-only with no sync, matches contacts by externalId equal to the user ID passed to Superwall identify() or the original app user ID, then by the email user attribute, then by a user ID that is an email address, and lists sandbox events and unmatched users as skipped integration activity. To connect Adapty, use integrations connect adapty or connect_integration with only a webhook secret of at least 16 characters that the user also sets as the Adapty webhook''s authorization header value (no API key), connecting before the user clicks Save in Adapty; it is webhook-only with no sync, matches contacts by externalId equal to the customer user ID passed to Adapty identify() or the Adapty profile ID, then by the profile email, then by the email user attribute, then by a customer user ID that is an email address, and lists sandbox events, renamed events, and unmatched profiles as skipped integration activity. For private list member opt-out, use allowMemberUnsubscribe in list API/MCP or --allow-member-unsubscribe/--no-allow-member-unsubscribe in CLI; default off, omission preserves updates, false disables, and members cannot self-join or rejoin private lists. For one-time countdowns such as Black Friday, create the sequence with a manual trigger (nobody enters automatically), set keyDates once (zone-less times are read in the key-dates timezone) and give steps waitUntilKeyDate (each contact gets their own send time within 4h by default; keyDates.sendWindow.spreadOverHours or --send-spread-hours change it, 0 is exact; write deadline emails with the end time, never hours left); after enabling, enroll everyone, lists or a segment with enroll-audience or enroll_sequence_audience (estimate first, then apply; for hand-picked contacts beyond 500 pass the audience {type rules, include [], includedSubscriberIds [...]}), watch runs with audience-enrollments (includedSubscriberCount is the picked total; MCP lists only the first 20 IDs), and expect late enrollees to skip steps whose moment already passed; for per-contact timelines such as a due date, give steps waitUntil with source attribute (the contact''s date attribute, any trigger) and pastAction skip so late joiners only receive the steps still ahead, keeping pastAction continue on a final step everyone should get; use scheduledFor (--schedule-at) to start on a date and audienceAutoEnroll (--keep-enrolling / --auto-enroll-*) to keep adding later joiners until the last key date. When a send needs values that are the same for everyone in the run and only known at start time (a sale end time, a discount percentage, a cut-off time), pass them as data on enroll_sequence_audience (--data-json/--data-file), a JSON object up to 8 KB, and reference them in the sequence''s emails and conditions as {{enrollment.field}}; auto-enroll syncs carry no run data. When creating sequences, send trigger settings as top-level fields (trigger, listId) and step delays as objects such as {"days": 2}; treat create and update warnings about ignored fields or unknown lists, and a create warning about a list-less contact_added trigger, as problems to fix before enabling; report enable warnings such as a trigger that enrolls every new contact to the user, and when the user already chose every contact (listScope any_contact), confirm rather than change it. To create a workspace without a website, use companies create --without-website --name or create_company with noWebsite and name (a non-blank domain wins when both are sent); description is optional, up to 500 characters, and withWelcomeSequence only drafts the four-email sequence, which stays off until turned on. For scratch-to-reveal popups, pass reward (--reward-json or create_popup/update_popup reward) with the store''s real discount code, never an invented one; the value and code stay out of the embed script, are shown once the signup form is submitted, and are saved as the subscriber''s discount attribute, so welcome emails use {{discount.value}} and {{discount.code}}. Saved forms and popups resubscribe globally unsubscribed contacts who submit again, whatever duplicateStrategy; to require a confirmation email first set resubscribeBehavior double_opt_in (--resubscribe-behavior, create_form/update_form/create_popup/update_popup), which needs a double opt-in confirmation email and default sender or returns 400. When a form or popup gets fake or bot signups, turn on botProtection (--bot-protection, create_form/update_form/create_popup/update_popup): an invisible Cloudflare check runs before each signup and failed checks must confirm by email; it needs a double opt-in confirmation email and default sender or returns 400. To close or reopen several inbox conversations, pass up to 100 IDs to inbox close/reopen or bulk_update_conversation_status and report updated, unchanged and not-found IDs; confirm before closing conversations the user did not name. Flagged inbox mail goes to Spam (inbox list --spam, list_conversations spam true; move back with inbox not-spam or bulk_update_conversation_spam). A receiving domain is a domain whose mail reaches the inbox (any address on it); a workspace has one, and once verified, replies to emails from all sending domains come back to it and Inbox turns on. Manage it with receiving-domains list/add/get/verify/remove or list_receiving_domains, add_receiving_domain, get_receiving_domain, verify_receiving_domain, remove_receiving_domain; publish the MX (and TXT when listed), suggest a subdomain like support.acme.com when add refuses a domain that already receives mail elsewhere (domain_has_mailbox), and remove only after the user confirms, since all its mail stops. When a conversation has a recipientAddress, reply from the sender profile with that email if one exists. The inbox also receives any email sent to its address; get it with inbox address or get_inbox_address, and set a branded address like support@support.acme.com on one of the receiving domains with inbox address --local-part/--domain or update_inbox_address only after the user confirms the address (changing an active one stops the old address; a new one waits for its receiving domain to verify). Forward one message with inbox forward or forward_conversation_message only to an address the user confirmed, and do not repeat a successful forward; flag a conversation for later with inbox mark-unread or mark_conversation_unread; attach files to replies with --attach or base64 attachments when attachmentsAvailable is true. To find real emails from brands like the user''s (matched to their company description on every call), use references --kind campaign, sequence or transactional (or list_email_references), add --all (scope all) to browse the whole gallery for that kind and --search to match by meaning, and remix a result with its URL; each email''s analysis (main button, length, layout, voice, structure, takeaways) helps pick the best model; when a competitor the user wants is missing, ask for it with brand-requests add or request_gallery_brand and follow it with brand-requests or list_gallery_brand_requests. To follow what competitors send, watch them with watchlist add or watch_brand (brands not in the gallery are requested the same way) and read their emails newest first with watchlist emails or list_watched_brand_emails, passing since for recent ones. To see a gallery example written for the user''s brand (or another website) before saving anything, use templates preview-example or preview_template_from_example, or sequences preview-example or preview_sequence_from_example for a sequence''s first emails. To start from a public email gallery example, use templates from-example or create_template_from_example for one email and sequences from-example or create_sequence_from_example for a whole sequence, passing the gallery URL, an optional brief and, for a sequence, optional stepNumbers (--steps; 1-based positions of the example emails to keep); the result is written in the user''s brand without naming the example brand, a cloned sequence stays a draft while its emails generate, and a successful call should not be repeated. When reporting A/B results, read significance from ab-tests stats or get_ab_test_stats and call a leader that is not_significant ahead rather than the winner. Use stats --clients or get_email_client_stats for mail client and device shares of unique opens, noting that privacy-proxy opens hide the device. Use stats --links or get_stats_breakdown to split the funnel and revenue by email, sequence, email type, provider or domain and drill in with the filter from a row (source, recipientDomain), get_link_click_stats for clicks per link destination across every email, noting that query strings are ignored so UTM variants of a page count together. Email engagement segment filters accept whole-hour windows such as 24h or 2:12h for recency under a few days; custom event and push filters stay on days. Use the segment_exited trigger for flows that start when an active contact stops matching a segment (unsubscribes and bounces do not count), set the company frequency cap with frequency-cap set or set_frequency_cap and turn on frequencyCapEnabled (--respect-frequency-cap) for sequences that should skip email steps for contacts already at the cap (leave it off for time-sensitive flows), turn on activeSubscribersOnly (--active-subscribers-only) for marketing sequences that unsubscribed and bounced contacts should not enter at all, mark a contact who reported spam with subscribers update --status complained or update_subscriber status complained (it suppresses the address and unsubscribes them), pick A/B winners by revenue, a goal or an event with winnerCriteria goal_value/goal_conversion_rate plus winnerGoalId (default-revenue for purchases) or event_rate plus winnerEventName (--winner-criteria with --winner-goal/--winner-event), and report page views from sequenzy.page() as the web.page_viewed event. To stream data to the user''s warehouse, use data-exports create or create_data_export with credentials the user provides for their S3, GCS or S3-compatible bucket; a test file is written first, the secret is never returned, delivery is at least once (deduplicate on id), and failing exports retry on their own, so report lastError and exportedThrough rather than re-running in a loop. To import from the user''s warehouse, connect it with warehouse connections create or create_warehouse_connection using a read-only user and credentials the user provides, preview the query with preview_warehouse_query before mapping its columns, then create a sync; subscriber syncs replace mapped values without clearing others or resubscribing anyone, event syncs only touch existing contacts, and only changed rows are sent each run. For Stripe failed-payment recovery, nothing is applied automatically: create the saas.payment_failed sequence with propertyFilters attemptCount equals 1 and billingReason one_of subscription_create, subscription_cycle or subscription_update, enrollmentMode matching_field on invoiceId, and a stop on saas.purchase matching invoiceId, but only when Stripe is the only connected provider sending that event. Use {{event.hostedInvoiceUrl}}, {{event.amountDueFormatted}} and willRetry in the emails. For push notifications, check push settings or get_push_settings first; push campaigns and push sequence steps reach only contacts with an active browser or app device on a set-up platform, and sending a push campaign or test push needs explicit user confirmation. In-app steps (type in_app) only store items in each contact''s in-app feed; tell the user their app must fetch and render the feed (Settings > In-app has a setup prompt), and read a contact''s feed with in-app list or list_in_app_messages. Start an in-app step from in-app templates or list_in_app_templates (add the urls its link buttons open) and draft its copy with in-app write or write_in_app_copy. For a survey or other custom design (a Survicate or Braze custom HTML message), check the document with in-app html validate or validate_in_app_html, then use an in_app step with format html and html (in-app html set or update_sequence_node); Braze Liquid is converted, and the app needs a current SDK (React Native: webView prop; web: data-sequenzy-in-app)For mobile apps, set the company category with companies update --category mobile_app or update_company websiteType (offer it when integrations connect returns websiteTypeSuggestion after RevenueCat, Superwall or Adapty), list push-first journeys with sequences templates or list_sequence_templates, and create one with sequences create-from-template or create_sequence_from_template (push and in-app for contacts reachable by push, email for everyone else, daytime waits in each contact''s timezone); review push and in-app copy before enabling. Translate every sequence email and enabled transactional email into a language at once with templates localizations translate-missing or translate_missing_template_localizations (only missing or failed translations; edited, up-to-date and outdated ones are kept; adding a language in the dashboard already does this), and follow progress with templates localizations coverage or get_template_localization_coverage. Move an older verified sending domain onto the current DNS records in place with websites upgrade-dns or upgrade_sending_domain_dns when website.dnsUpgrade.status is available: the user adds the returned CNAMEs next to the current records and removes nothing, the domain keeps sending on its current records and switches by itself about an hour after the required ones are visible on public DNS (sending is normally not interrupted; if that is not possible for a domain, SES sends can be held a few minutes), and dnsUpgrade.oldRecords can be deleted after deleteOldRecordsAfter (8 days after the switch); an older SES-only domain needs a working DMARC record before it can start; it is a recommended, optional one-time upgrade (better deliverability and security) and cannot be cancelled once started. Change every email of a sequence at once with sequences edit-emails or edit_sequence_emails (a cream background everywhere, no header, a new structure for email 2): the prompt picks the emails unless you pass -